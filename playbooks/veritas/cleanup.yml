- name: Check if oc is available in PATH
  ansible.builtin.shell: which oc
  register: oc_in_path
  failed_when: false
  changed_when: false
  tags: cleanup

- name: Check if already logged in to OCP
  ansible.builtin.shell: oc whoami
  register: oc_logged_in
  failed_when: false
  changed_when: false
  when: oc_in_path.rc == 0
  tags: cleanup

- name: Set OC binary and kubeconfig based on login status
  ansible.builtin.set_fact:
    use_oc_bin: "{{ 'oc' if oc_in_path.rc == 0 else oc_bin }}"
    kubeconfig_param: "{{ (lookup('env', 'HOME') + '/.kube/config') if (oc_logged_in.rc | default(1)) == 0 else kubeconfig }}"
  tags: cleanup

- name: Gather all VirtualMachine resources in test-vms
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_param }}"
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    namespace: test-vms
  register: vm_list
  ignore_errors: yes
  tags: cleanup

- name: Delete every VM in test-vms
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_param }}"
    state: absent
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    namespace: test-vms
    name: "{{ item.metadata.name }}"
  loop: "{{ vm_list.resources | default([]) }}"
  when: vm_list.resources is defined and vm_list.resources | length > 0
  ignore_errors: yes
  tags: cleanup

- name: Wait for all VMs in test-vms namespace to be deleted
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_param }}"
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    namespace: test-vms
  register: vm_remaining
  retries: 10
  delay: 6
  until: vm_remaining.resources | length == 0
  tags: cleanup

- name: Wait until no PVCs remain in test-vms namespace
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_param }}"
    kind: PersistentVolumeClaim
    namespace: test-vms
  register: pvc_list
  retries: 10           
  delay: 6           
  until: pvc_list.resources | length == 0
  tags: cleanup

- name: Delete StorageClass infoscale
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_param }}"
    state: absent
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: infoscale
  ignore_errors: yes
  tags: cleanup

- name: Delete InfoScaleCluster infoscalecluster-dev
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_param }}"
    state: absent
    api_version: infoscale.veritas.com/v1
    kind: InfoScaleCluster
    namespace: infoscale-vtas
    name: infoscalecluster-dev
  ignore_errors: yes
  tags: cleanup

- name: Delete Veritas License license-dev
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_param }}"
    state: absent
    api_version: vlic.veritas.com/v1
    kind: License
    namespace: infoscale-vtas
    name: license-dev
  ignore_errors: yes
  tags: cleanup

- name: Delete namespace infoscale-vtas
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_param }}"
    state: absent
    api_version: v1
    kind: Namespace
    name: infoscale-vtas
  ignore_errors: yes
  tags: cleanup